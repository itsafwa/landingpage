<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لا اتصال | مبادرة صفوة</title>
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  body { margin: 0; font-family: system-ui, 'Segoe UI', Tahoma, sans-serif; background: #111224; color: #f8f9fa; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
  .card { max-width: 480px; }
  img { width: 110px; height: 110px; border-radius: 9999px; border: 3px solid rgba(212,175,55,.4); object-fit: cover; }
  h1 { font-size: 30px; margin: 22px 0 10px; }
  p { color: #c3cede; line-height: 1.9; font-size: 17px; }
  .btns { margin-top: 26px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  button, a.btn { background: #d4af37; color: #111224; font-weight: bold; border: none; padding: 12px 26px; border-radius: 9999px; font-size: 16px; cursor: pointer; text-decoration: none; }
  a.btn.ghost { background: transparent; color: #f2c14e; border: 1px solid rgba(212,175,55,.5); }
</style>
</head>
<body>
  <div class="card">
    <img src="icon-192.png" alt="شعار مبادرة صفوة">
    <h1>لا اتصال بالإنترنت</h1>
    <p>يبدو أن الاتصال انقطع. الصفحات التي زرتها من قبل قد تفتح من النسخة المخزّنة على جهازك، وجرّب إعادة المحاولة عند عودة الاتصال.</p>
    <div class="btns">
      <button onclick="location.reload()">إعادة المحاولة</button>
      <a class="btn ghost" href="index.html">الصفحة الرئيسة</a>
    </div>
  </div>
</body>
</html>
