<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصفحة غير موجودة | مبادرة صفوة</title>
    <link rel="icon" type="image/png" href="icon-192.png">
    <style>
        @font-face { font-family: 'thmanyah sans'; src: url('assets/fonts/thmanyahsans-Regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
        @font-face { font-family: 'thmanyah serif display'; src: url('assets/fonts/thmanyahserifdisplay-Bold.woff2') format('woff2'); font-weight: 700; font-display: swap; }
        body { margin: 0; font-family: 'thmanyah sans', sans-serif; background: #111224; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 2rem 1rem; box-sizing: border-box; }
        main { max-width: 560px; width: 100%; }
        h1 { font-family: 'thmanyah serif display', serif; font-size: 5rem; margin: 0 0 .5rem; color: #d4af37; }
        p { color: #c9cad6; font-size: 1.15rem; margin: 0 0 1.6rem; }
        img { width: 84px; height: 84px; border-radius: 50%; margin-bottom: 1.2rem; }
        .btn { display: inline-block; background: #d4af37; color: #1a1b35; font-weight: 700; padding: .7rem 1.8rem; border-radius: 999px; text-decoration: none; }
        .links { display: flex; flex-wrap: wrap; gap: .6rem; justify-content: center; margin-top: 1.4rem; }
        .links a { display: inline-block; border: 1px solid rgba(212,175,55,.45); color: #e8cf7a; font-weight: 700; padding: .5rem 1.2rem; border-radius: 999px; text-decoration: none; font-size: .95rem; }
        .links a:hover { background: rgba(212,175,55,.12); }
        .site-search { position: relative; max-width: 420px; margin: 0 auto 1.6rem; }
        .site-search-input { width: 100%; box-sizing: border-box; background: rgba(255,255,255,.08); border: 1px solid rgba(212,175,55,.4); border-radius: 999px; padding: .7rem 1.2rem; color: #fff; font-family: inherit; font-size: 1rem; outline: none; }
        .site-search-input:focus { border-color: #d4af37; box-shadow: 0 0 0 3px rgba(212,175,55,.35); }
        .site-search-input::placeholder { color: #9a9cb0; }
        .site-search-results { position: absolute; right: 0; left: 0; top: calc(100% + 8px); background: #fff; border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,.35); overflow: hidden; text-align: right; z-index: 50; }
        .site-search-results.hidden { display: none; }
        .site-search-results a { display: block; padding: .6rem 1rem; color: #1a1b35; text-decoration: none; font-size: .95rem; border-bottom: 1px solid #f3f4f6; background: none; border-radius: 0; font-weight: 400; }
        .site-search-results a:hover { background: #fefce8; }
        .site-search-results > div { padding: .55rem 1rem .2rem; font-size: .72rem; font-weight: 700; color: #b8912a; }
        .site-search-results span { color: #9ca3af; font-size: .78rem; }
    </style>
</head>
<body>
    <main>
        <img src="assets/safwa-logo.webp" alt="شعار مبادرة صفوة">
        <h1>٤٠٤</h1>
        <p>عذرًا، الصفحة التي تبحث عنها غير موجودة. جرّب البحث أو أحد الروابط التالية:</p>
        <div class="site-search" data-prefix="">
            <input type="text" class="site-search-input" placeholder="ابحث في الموقع والكتب واللقاءات…" autocomplete="off" aria-label="بحث في الموقع">
            <div class="site-search-results hidden"></div>
        </div>
        <a class="btn" href="index.html">العودة إلى الصفحة الرئيسة</a>
        <div class="links">
            <a href="index.html#directory">دليل البرامج</a>
            <a href="library.html">مكتبة صفوة</a>
            <a href="lectures.html">سجل اللقاءات</a>
            <a href="faq.html">الأسئلة الشائعة</a>
        </div>
    </main>
    <script src="search-index.js"></script>
    <script src="search.js"></script>
    <script data-goatcounter="https://safwa.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
